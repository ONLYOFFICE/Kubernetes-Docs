# Kubernetes v1.30+ AppArmor configuration for the Helm chart.
# Profiles must be loaded on every worker node before these values are used.

docservice:
  containerSecurityContext:
    enabled: true
    runAsUser: 101
    runAsGroup: 101
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
    appArmorProfile:
      type: Localhost
      localhostProfile: onlyoffice-docs

