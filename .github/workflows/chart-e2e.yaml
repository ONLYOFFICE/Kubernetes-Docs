name: Chart e2e

run-name: >-
  Chart e2e: ${{ github.event.pull_request.title || format('manual ({0})', inputs.images-source) }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**/README.md'
      - '**/CHANGELOG.md'
      - '**/LICENSE'
      - '**/CLAUDE.md'
      - 'docs/**'
      # GitHub workflows are not used here; .github/ci (scripts) still triggers the run
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      images-source:
        description: 'Images: auto (values.yaml tag: release, then 4testing), 4testing-latest (newest build of the images.tag version), release, 4testing'
        type: choice
        options: [auto, 4testing-latest, release, 4testing]
        default: auto
      images-tag:
        description: 'Image tag (empty = images.tag from values.yaml)'
        type: string

concurrency:
  group: chart-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  HELM_VERSION: v3.17.3
  KIND_VERSION: v0.24.0
  KIND_NODE_IMAGE: kindest/node:v1.31.0
  NFS_PROVISIONER_SIZE: 20Gi
  RELEASE: documentserver        # release name as in README
  DOCS_NAMESPACE: docs
  CI_DIR: .github/ci

# The k8s job needs docker on the runner (kind creates the cluster as docker containers).
# Actions are referenced by full URL, so they do not depend on DEFAULT_ACTIONS_URL of the instance.

jobs:
  resolve-images:
    name: Resolve images
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      tag: ${{ steps.resolve.outputs.tag }}
      prefix: ${{ steps.resolve.outputs.prefix }}
    steps:
      - uses: https://github.com/actions/checkout@v4

      - name: Resolve image source and tag
        id: resolve
        env:
          API_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY_EVENT: ${{ github.event.pull_request.body }}
          INPUT_SOURCE: ${{ inputs.images-source }}
          INPUT_TAG: ${{ inputs.images-tag }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "${PR_NUMBER}" ]]; then
            # PR body is read live from the Gitea API, so "Re-run jobs" picks up an edited description.
            # Falls back to the body from the event payload if the API is not available.
            if body=$(curl -fsSL --retry 3 -H "Authorization: token ${API_TOKEN}" \
                 "${SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                 | jq -r '.body // ""'); then
              PR_BODY="${body}"
            else
              echo "::warning::Could not read the PR description from the Gitea API, using the event payload"
              PR_BODY="${PR_BODY_EVENT}"
            fi
            export PR_BODY
          fi
          bash "${CI_DIR}/scripts/resolve-images.sh"

  kubernetes:
    name: k8s (${{ matrix.scenario }})
    needs: resolve-images
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # install: clean install of the PR chart
        # upgrade: install the chart from the base branch, then upgrade to the PR chart
        scenario: [install, upgrade]
    env:
      PLATFORM: kind
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      # Jobs share the host docker daemon: a fixed name makes parallel jobs (install/upgrade,
      # several PRs) fight over the same "<name>-control-plane" container
      KIND_CLUSTER: ci-${{ github.run_id }}-${{ matrix.scenario }}
    steps:
      - uses: https://github.com/actions/checkout@v4

      - name: Checkout base chart
        if: matrix.scenario == 'upgrade'
        uses: https://github.com/actions/checkout@v4
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          path: base-chart

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: https://github.com/azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # Optional, avoids Docker Hub anonymous pull limits
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: https://github.com/docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Create kind cluster
        uses: https://github.com/helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: ${{ env.KIND_CLUSTER }}

      # act_runner runs the job in a container: 127.0.0.1 in kubeconfig is the job container,
      # not the host where kind published the API port. Join the kind network and use the internal address.
      - name: Make kind API reachable from the job container
        run: |
          if [[ -f /.dockerenv ]]; then
            docker network connect kind "$(hostname)" 2>/dev/null || true
            mkdir -p "$HOME/.kube"
            kind get kubeconfig --internal --name "${KIND_CLUSTER}" > "$HOME/.kube/config"
          fi
          kubectl cluster-info

      # README "Install Persistent Storage": NFS Server Provisioner -> storage class "nfs" (chart default)
      - name: Persistent storage (NFS Server Provisioner)
        run: |
          # kind node image has no NFS client
          docker exec "${KIND_CLUSTER}-control-plane" bash -c \
            'apt-get update -qq && apt-get install -y -qq nfs-common > /dev/null'
          helm repo add nfs-server-provisioner https://kubernetes-sigs.github.io/nfs-ganesha-server-and-external-provisioner
          helm install nfs-server nfs-server-provisioner/nfs-server-provisioner \
            --set persistence.enabled=true \
            --set persistence.storageClass=standard \
            --set persistence.size="${NFS_PROVISIONER_SIZE}" \
            --wait --timeout 5m

      - name: Dependencies (docs/DEPENDENCIES.md)
        env:
          DEPS_STORAGE_CLASS: standard
        run: bash "${CI_DIR}/scripts/install-deps.sh" kind

      - name: Chart values
        env:
          IMAGES_PREFIX: ${{ needs.resolve-images.outputs.prefix }}
          IMAGES_TAG: ${{ needs.resolve-images.outputs.tag }}
        run: |
          bash "${CI_DIR}/scripts/image-values.sh" values.yaml "${IMAGES_PREFIX}" "${IMAGES_TAG}" > /tmp/images.yaml
          cat /tmp/images.yaml
          echo "HELM_ARGS=-f ${CI_DIR}/values-ci.yaml -f /tmp/images.yaml" >> "$GITHUB_ENV"
          [[ -d base-chart ]] && echo "BASE_CHART=base-chart" >> "$GITHUB_ENV"
          true

      - name: Deploy and test
        run: bash "${CI_DIR}/scripts/deploy-test.sh"

      - name: Collect debug info
        if: failure()
        run: bash "${CI_DIR}/scripts/collect-debug.sh" debug

      # Gitea-compatible fork of actions/upload-artifact@v4
      - name: Upload debug info
        if: failure()
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: debug-k8s-${{ matrix.scenario }}
          path: debug
          retention-days: 7

      # The cluster lives in the host docker daemon and outlives the job container
      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "${KIND_CLUSTER}" || true
