name: Chart e2e

run-name: >-
  Chart e2e: ${{ github.event.pull_request.title || format('manual ({0})', inputs.images-source) }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**/README.md'
      - '**/CHANGELOG.md'
      - '**/LICENSE'
      - '**/CLAUDE.md'
      - 'docs/**'
      - '.gitea/**'
  workflow_dispatch:
    inputs:
      images-source:
        description: 'Images: auto (values.yaml tag: release, then 4testing), 4testing-latest (newest build of the images.tag version), release, 4testing'
        type: choice
        options: [auto, 4testing-latest, release, 4testing]
        default: auto
      images-tag:
        description: 'Image tag (empty = images.tag from values.yaml)'
        type: string
      openshift:
        description: 'Run OpenShift (MicroShift) tests'
        type: boolean
        default: true

concurrency:
  group: chart-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  HELM_VERSION: v3.17.3
  KIND_VERSION: v0.24.0
  KIND_NODE_IMAGE: kindest/node:v1.31.0
  KIND_CLUSTER: ci
  NFS_PROVISIONER_SIZE: 20Gi
  MICROSHIFT_REF: main           # pin to a commit of microshift-io/microshift for reproducible runs
  MICROSHIFT_TAG: latest
  ROUTE_HOST: docs.microshift.test
  RELEASE: documentserver        # OPENSHIFT.md: the chart's service account is named after the release
  DOCS_NAMESPACE: docs
  CI_DIR: .github/ci

jobs:
  resolve-images:
    name: Resolve images
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      tag: ${{ steps.resolve.outputs.tag }}
      prefix: ${{ steps.resolve.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image source and tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_SOURCE: ${{ inputs.images-source }}
          INPUT_TAG: ${{ inputs.images-tag }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # PR body is read live, so "Re-run jobs" picks up an edited description
          if [[ -n "${PR_NUMBER}" ]]; then
            PR_BODY="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json body -q .body)"
            export PR_BODY
          fi
          bash "${CI_DIR}/scripts/resolve-images.sh"

  kubernetes:
    name: k8s (${{ matrix.scenario }})
    needs: resolve-images
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # install: clean install of the PR chart
        # upgrade: install the chart from the base branch, then upgrade to the PR chart
        scenario: [install, upgrade]
    env:
      PLATFORM: kind
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout base chart
        if: matrix.scenario == 'upgrade'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          path: base-chart

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # Optional, avoids Docker Hub anonymous pull limits. Not available for PRs from forks.
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: ${{ env.KIND_CLUSTER }}

      # README "Install Persistent Storage": NFS Server Provisioner -> storage class "nfs" (chart default)
      - name: Persistent storage (NFS Server Provisioner)
        run: |
          # kind node image has no NFS client
          docker exec "${KIND_CLUSTER}-control-plane" bash -c \
            'apt-get update -qq && apt-get install -y -qq nfs-common > /dev/null'
          helm repo add nfs-server-provisioner https://kubernetes-sigs.github.io/nfs-ganesha-server-and-external-provisioner
          helm install nfs-server nfs-server-provisioner/nfs-server-provisioner \
            --set persistence.enabled=true \
            --set persistence.storageClass=standard \
            --set persistence.size="${NFS_PROVISIONER_SIZE}" \
            --wait --timeout 5m

      - name: Dependencies (docs/DEPENDENCIES.md)
        env:
          DEPS_STORAGE_CLASS: standard
        run: bash "${CI_DIR}/scripts/install-deps.sh" kind

      - name: Chart values
        env:
          IMAGES_PREFIX: ${{ needs.resolve-images.outputs.prefix }}
          IMAGES_TAG: ${{ needs.resolve-images.outputs.tag }}
        run: |
          bash "${CI_DIR}/scripts/image-values.sh" values.yaml "${IMAGES_PREFIX}" "${IMAGES_TAG}" > /tmp/images.yaml
          cat /tmp/images.yaml
          echo "HELM_ARGS=-f ${CI_DIR}/values-ci.yaml -f /tmp/images.yaml" >> "$GITHUB_ENV"
          [[ -d base-chart ]] && echo "BASE_CHART=base-chart" >> "$GITHUB_ENV"
          true

      - name: Deploy and test
        run: bash "${CI_DIR}/scripts/deploy-test.sh"

      - name: Collect debug info
        if: failure()
        run: bash "${CI_DIR}/scripts/collect-debug.sh" debug

      - name: Upload debug info
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-k8s-${{ matrix.scenario }}
          path: debug
          retention-days: 7

  openshift:
    name: OpenShift (${{ matrix.scc }}, security contexts ${{ matrix.contexts }})
    needs: resolve-images
    if: github.event_name != 'workflow_dispatch' || inputs.openshift
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Combinations marked as working in docs/OPENSHIFT.md
        include:
          - { scc: docs-components, contexts: "off" }
          - { scc: anyuid,          contexts: "off" }
          - { scc: nonroot-v2,      contexts: "on" }
    env:
      PLATFORM: openshift
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Start MicroShift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${CI_DIR}/scripts/microshift-up.sh"

      - name: Dependencies (docs/DEPENDENCIES.md)
        env:
          DEPS_STORAGE_CLASS: ci-local
        run: bash "${CI_DIR}/scripts/install-deps.sh" openshift

      # docs/OPENSHIFT.md "Assign SCC to service accounts"
      - name: Assign SCC ${{ matrix.scc }}
        run: |
          if [[ "${{ matrix.scc }}" == "docs-components" ]]; then
            sed "s/<namespace>/${DOCS_NAMESPACE}/g" sources/scc/common.yaml | kubectl apply -f -
          else
            bash "${CI_DIR}/scripts/scc-grant.sh" "${{ matrix.scc }}" user \
              "system:serviceaccount:${DOCS_NAMESPACE}:${RELEASE}" \
              "system:serviceaccount:${DOCS_NAMESPACE}:wopi-sa"
          fi

      - name: Chart values
        env:
          IMAGES_PREFIX: ${{ needs.resolve-images.outputs.prefix }}
          IMAGES_TAG: ${{ needs.resolve-images.outputs.tag }}
          SCC: ${{ matrix.scc }}
          CONTEXTS: ${{ matrix.contexts }}
        run: |
          bash "${CI_DIR}/scripts/image-values.sh" values.yaml "${IMAGES_PREFIX}" "${IMAGES_TAG}" > /tmp/images.yaml
          # Fully qualified image names: CRI-O does not guess the registry for short names
          yq -i '.images.registry = "docker.io"' /tmp/images.yaml
          bash "${CI_DIR}/scripts/openshift-values.sh" values.yaml "${SCC}" "${CONTEXTS}" "${ROUTE_HOST}" > /tmp/openshift.yaml
          cat /tmp/images.yaml /tmp/openshift.yaml
          echo "HELM_ARGS=-f ${CI_DIR}/values-ci.yaml -f /tmp/images.yaml -f /tmp/openshift.yaml --set persistence.storageClass=ci-local" >> "$GITHUB_ENV"

      - name: Deploy and test
        run: bash "${CI_DIR}/scripts/deploy-test.sh"

      - name: Check pods were admitted with ${{ matrix.scc }}
        run: |
          kubectl get pods -n "${DOCS_NAMESPACE}" \
            -o custom-columns='POD:.metadata.name,SCC:.metadata.annotations.openshift\.io/scc'
          wrong=$(kubectl get pods -n "${DOCS_NAMESPACE}" -o json \
            | jq -r --arg scc "${{ matrix.scc }}" '.items[] | select(.metadata.annotations["openshift.io/scc"] != $scc) | .metadata.name')
          if [[ -n "${wrong}" ]]; then echo "::error::Pods not admitted with ${{ matrix.scc }}: ${wrong}"; exit 1; fi

      - name: Collect debug info
        if: failure()
        run: bash "${CI_DIR}/scripts/collect-debug.sh" debug

      - name: Upload debug info
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-openshift-${{ matrix.scc }}
          path: debug
          retention-days: 7
