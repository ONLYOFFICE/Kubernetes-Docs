name: Chart e2e (GitHub)

# The e2e tests need runners Gitea does not have (kind with docker, MicroShift), so they run on GitHub
# (.github/workflows/chart-e2e.yaml, manual trigger) on the mirror github.com/ONLYOFFICE/Kubernetes-Docs.
# This job waits until the PR commit is mirrored, starts the GitHub run, follows it and reports
# its result here: as the job result and as the "chart-e2e / github" commit status linking to the run.
#
# Gitea reads only .gitea/workflows when it exists, so .github/workflows is not run here.
#
# Needs secret E2E_GITHUB_TOKEN: GitHub fine-grained token for the mirror repo with
# "Actions: Read and write" and "Contents: Read".
# Optional variable E2E_GITHUB_REPO (default ONLYOFFICE/Kubernetes-Docs).

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]
    paths-ignore:
      - '**/README.md'
      - '**/CHANGELOG.md'
      - '**/LICENSE'
      - '**/CLAUDE.md'
      - 'docs/**'

concurrency:
  group: chart-e2e-github-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  github-e2e:
    name: Chart e2e on GitHub
    # Only release/hotfix branches of this repo: branches of forks are not mirrored
    if: >-
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/v'))
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: https://github.com/actions/checkout@v4

      - name: Run e2e on GitHub and wait for the result
        env:
          GH_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          GH_REPO: ${{ vars.E2E_GITHUB_REPO || 'ONLYOFFICE/Kubernetes-Docs' }}
          GITEA_TOKEN: ${{ github.token }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY_EVENT: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .gitea/scripts/github-e2e.sh
